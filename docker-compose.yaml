
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENV_FILE= .env
    #image: anubislord2109/task-manager-backend:test
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    #environment:
    #  - backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - ENV_FILE=.env
    #image: anubislord2109/task-manager-frontend:test
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    env_file:
     - ./frontend/.env
    #environment:
    #  - frontend/.env
