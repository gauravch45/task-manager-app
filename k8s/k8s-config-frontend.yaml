apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test
  name: test-env-frontend
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: test-env-frontend
  template:
    metadata:
      labels:
        app: test-env-frontend
    spec:
      containers:
        - name: frontend
          image: anubislord2109/task-manager-frontend:test
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: test-env-config
                  key: REACT_APP_API_URL
---
apiVersion: v1
kind: Service
metadata:
  namespace: test
  name: frontend-service
spec:
  selector:
    app: test-env-frontend
  ports:
    - name: frontend-port
      port: 80
      targetPort: 80
      nodePort: 30371
  type: NodePort
