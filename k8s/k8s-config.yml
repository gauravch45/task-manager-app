---
apiVersion: v1
kind: Namespace
metadata:
  name: task-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: task-manager
  name: task-manager-config
data:
  port: "5000"
  NODE_ENV: "production"
  REACT_APP_API_URL: "http://localhost:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: task-manager
  name: deployment
spec:
  selector:
    matchLabels: 
     app.kubernetes.io/name: task-manager
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-manager
    spec:
      containers:
        - name: backend
          image: anubislord2109/task-manager-backend:test
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: task-manager-config
                  key: port
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: MONGO_URI
        
        
        - name: frontend
          image: anubislord2109/task-manager-frontend:test
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: task-manager-config
                  key: REACT_APP_API_URL
---
apiVersion: v1
kind: Service
metadata:
  namespace: task-manager
  name: frontend-service
spec:
  selector:
    app.kubernetes.io/name: task-manager
  ports:
    - name: frontend-port
      port: 80
      targetPort: 80
      nodePort: 30371
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  namespace: task-manager
  name: backend-service
spec:
  selector:
    app.kubernetes.io/name: task-manager
  ports:
    - name: backend-port
      port: 5000
      targetPort: 5000
      nodePort: 31546
  type: NodePort

