apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: task-manager
  name: task-manager-backend
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: task-manager-backend
  template:
    metadata:
      labels:
        app: task-manager-backend
    spec:
      containers:
        - name: backend
          image: anubislord2109/task-manager-backend:test
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: task-manager-config
                  key: port
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata:
  namespace: task-manager
  name: backend-service
spec:
  selector:
    app.kubernetes.io/name: task-manager
  ports:
    - name: backend-port
      port: 5000
      targetPort: 5000
      nodePort: 31546
  type: NodePort
